<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Shelf</title>
    <link rel="stylesheet" href="./style.css"/>
    <link rel="icon" href="./Icon/bookstall-or-library-icon-in-red-and-blue-color-vector.png" sizes="38x38"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet"/>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.182.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.182.0/examples/jsm/",
                "gsap": "https://cdn.skypack.dev/gsap@3.10.4"
            }
        }
    </script>

</head>
<body class="special-elite-regular">

    <!--How to use-->
    <div class="how-container">
        <div class="how"></div>
    </div>

    <!--Loading Page-->
    <div class="loading-page-container">
        <div class="loading-page">
            <h1 class="loading-text" style="color:rgb(139, 0, 0);">Loading...</h1>
        </div>
    </div>

    <!--Heading and Search bar-->
    <div class="container">
        <div class="heading-container">
            <div class="heading">
                <a href="./Documentation/index.html" target="_blank"><h1 class="the-heading">Red Shelf</h1></a><br>
            </div>
        </div>

        <div class="search-container form">
            <form id="searchForm">
                <input type="number" id="fname" name="fname" max="62" min="1" step="1" placeholder="ID (1–62)" required><br>
                <input type="submit" class="button-24" value="Search">
            </form> 
        </div>
        
        <div class="search-container book">
            <button style="position: absolute; right: 1px; z-index: 99;" class="button-24 back">Back</button>
        </div>

        <div class="refresh-button-container">
            <button style="position: absolute; right: 1px; z-index: 99;" class="button-24 back refresh">Refresh</button>
        </div>

    </div>
    <!--Footer-->
    <div class="footer-container">
        <div class="footer">
            <div class="item_dash">
                <a target="_blank" href="https://youtube.com"><img class="youtube logo" src="./Icon/question_mark-removebg-preview.png"/></a>
            </div>
            <div class="item_dash">
                <a target="_blank" href="https://hi-arush.com"><img class="linkedin logo" src="./Icon/Arush_logo_black.PNG"/></a>
            </div>
            <div class="item_dash">
                <a target="_blank" href="https://github.com/arushraju/Red-Shelf"><img class="github logo" src="./Icon/GitHub_Invertocat_Black_Clearspace.svg"/></a>
            </div>
        </div>
    </div>


    <script src="./script.js" type="module"></script>
    
</body>
</html>
